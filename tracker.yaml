# Трекер сигналов: ваша обратная связь радару.
# Ключ — термин, как он показан в дашборде мелким моноширинным шрифтом (нижний регистр).
#
# status: наблюдаю | ставлю | сработал | мёртв
#   «мёртв» — сигнал больше не будет показываться.
# rating: "+" — интересно (радар поднимет похожие), "-" — мимо.
# note:   любая заметка для себя.
#
# Пример:
# signals:
#   hyper connection:
#     status: наблюдаю
#     rating: "+"
#     note: прочитать статью SimpleHC
signals: {}
