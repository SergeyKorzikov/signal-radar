name: chat

# Чат с нейросетью радара: вопрос = issue с заголовком «[чат] …», ответ приходит комментарием.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: chat-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  answer:
    # отвечаем только владельцу репозитория и только в чат-темах
    if: >-
      startsWith(github.event.issue.title, '[чат]') &&
      github.event.sender.login == github.repository_owner &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Нейросеть из кэша
        uses: actions/cache@v4
        with:
          path: ~/.cache/radar-models
          key: radar-model-v1
          restore-keys: radar-model-
      - name: Ответить
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: python -m radar chat --issue "$ISSUE"
